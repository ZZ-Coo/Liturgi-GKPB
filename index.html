<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F9F7F1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Liturgi GKPB</title>
    <script>
      // Runs synchronously, before anything paints — this (not main.ts)
      // is what actually prevents a light-mode flash for someone who has
      // dark saved or whose OS is set to dark. main.ts's initTheme() also
      // calls the equivalent logic for Vue's own reactive `isDark` state,
      // but by then the boot-loader below would already have painted once.
      try {
        var stored = localStorage.getItem('liturgi-theme')
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <style>
      /* Plain CSS spinner shown before Vue mounts — no JS, no animation
         library, just a transform: rotate() keyframe. That's a
         compositor-only animation (no layout/paint work per frame), so
         it stays smooth even on very low-end phones, unlike JS-driven
         or Lottie-style loaders. Vue's app.mount('#app') replaces this
         markup entirely on mount, so no cleanup code is needed. */
      .boot-loader {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #f9f7f1;
      }
      .boot-spinner {
        width: 26px;
        height: 26px;
        border-radius: 9999px;
        border: 3px solid #e3e0d2;
        border-top-color: #2c4e30;
        animation: boot-spin 0.7s linear infinite;
      }
      html.dark .boot-loader {
        background: #14150f;
      }
      html.dark .boot-spinner {
        border-color: #33362b;
        border-top-color: #6fae72;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loader" role="status" aria-label="Memuat">
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
